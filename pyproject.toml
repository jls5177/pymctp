# Root-level monorepo configuration
# This file helps coordinate development across all packages

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymctp-monorepo"
version = "0.2.3"
description = "PyMCTP monorepo - development workspace for all pymctp packages"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Justin Simon", email = "justin@simonctl.com" }
]

# Development dependencies needed across all packages
dependencies = [
    # Build tools
    "build>=1.0.0",
    "hatch>=1.7.0",
    "twine>=4.0.0",

    # Testing
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",

    # Linting and formatting
    "ruff>=0.1.0",
    "reuse>=4.0.0",

    # Documentation
    "pytz",
    "tzlocal",
]

[project.optional-dependencies]
# Install all packages in development mode
all = [
    "pymctp",
    "pymctp-sample-vendorextension",
    "pymctp-exerciser-aardvark",
    "pymctp-exerciser-qemu",
    "pymctp-exerciser-serial",
]

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

# Install all local packages in editable mode
dependencies = [
    "ipython",
]

[tool.hatch.envs.default.scripts]
# Convenient scripts for development
install-all = """
    pip install -e packages/pymctp
    pip install -e packages/pymctp-sample-vendorextension
    pip install -e packages/pymctp-exerciser-aardvark
    pip install -e packages/pymctp-exerciser-qemu
    pip install -e packages/pymctp-exerciser-serial
"""

build-all = "bash scripts/build-all.sh"
clean = "bash scripts/clean.sh"
test-all = "pytest tests/"
format-all = """
    ruff format packages/
    ruff check --fix packages/
"""
format-check = """
    ruff format --check packages/
    ruff check packages/
"""
license-check = "reuse lint"
license-add = "reuse annotate -c \"Justin Simon <justin@simonctl.com>\" -l MIT --merge-copyrights -r"

[tool.hatch.envs.test]
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage[toml]>=7.0.0",
]
pre-install-commands = [
    "pip install -e packages/pymctp",
]

[tool.hatch.envs.test.scripts]
run = "pytest {args:tests/}"
cov = "pytest --cov=pymctp --cov-report=html --cov-report=term {args:tests/}"
xml = "pytest --cov=pymctp --cov-report=xml {args:tests/}"

# Ruff configuration (applies to all packages)
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["./.history", "./.venv", "**/dist", "**/__pycache__"]

[tool.ruff.lint]
ignore = [
    "FBT001", "FBT002", "FBT003",
    "C901",
    "RUF012",
    "ARG001", "ARG002", "ARG005",
    "F403", "F405",
    "TID252", "F401",
    "T201",
    "N801", "N802", "N806",
    "S101",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "I001", "E501"]
"tests/**/*" = ["PLR2004", "S101", "TID252", "ARG001", "C408"]

# Coverage configuration
[tool.coverage.run]
source_pkgs = ["pymctp"]
branch = true
parallel = true
omit = [
    "packages/pymctp/src/pymctp/__about__.py",
    "packages/*/tests/*",
    "tests/*",
]

[tool.coverage.paths]
pymctp = ["packages/pymctp/src/pymctp", "*/pymctp/src/pymctp"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
