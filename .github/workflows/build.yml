name: Build

on:
  pull_request:
    branches: [ "development" ]
  push:
      branches: [ "development" ]

permissions:
  contents: read

jobs:
  build-core:
    name: Build Core Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build hatch
    - name: Build core package
      working-directory: packages/pymctp
      run: python -m build
    - name: Upload core artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-core
        path: packages/pymctp/dist/*

  build-extensions:
    name: Build Extension Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - pymctp-sample-vendorextension
          - pymctp-exerciser-aardvark
          - pymctp-exerciser-qemu
          - pymctp-exerciser-serial

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build ${{ matrix.package }}
      working-directory: packages/${{ matrix.package }}
      run: python -m build
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: packages/${{ matrix.package }}/dist/*

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    needs: build-core

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
    - name: Cache Hatch
      id: cache-hatch
      uses: actions/cache@v3
      with:
        path: /home/runner/.local/share/hatch/env/virtual/
        key: ${{ runner.os }}-hatch
    - name: Lint and typecheck
      run: |
        hatch run format-check
    - name: Validate license headers
      working-directory: packages/pymctp
      run: |
        hatch run license-check
    - name: Test with coverage
      working-directory: packages/pymctp
      run: |
        hatch run coverage:xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: packages/pymctp/coverage.xml
        fail_ci_if_error: true
        verbose: true
