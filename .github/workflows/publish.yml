# This workflow will upload Python Packages using build when a new tag is pushed to the repository.

name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    tags:
        - 'v*'
        - 'pymctp-*'
        - 'exerciser-*'
        - 'oem-*'
    branches: [ "main" ]

jobs:
  build-all-packages:
    name: Build all packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: pymctp
            path: packages/pymctp
          - name: pymctp-exerciser-aardvark
            path: packages/pymctp-exerciser-aardvark
          - name: pymctp-exerciser-qemu
            path: packages/pymctp-exerciser-qemu
          - name: pymctp-exerciser-serial
            path: packages/pymctp-exerciser-serial

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build hatch
    - name: Build ${{ matrix.package.name }}
      working-directory: ${{ matrix.package.path }}
      run: python -m build
    - name: Store distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.package.name }}
        path: ${{ matrix.package.path }}/dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs:
    - build-all-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - pymctp
          - pymctp-exerciser-aardvark
          - pymctp-exerciser-qemu
          - pymctp-exerciser-serial

    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download distributions for ${{ matrix.package }}
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: dist/
    - name: Publish ${{ matrix.package }} to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all distributions
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        path: dist/
        merge-multiple: true
    - name: Sign distributions with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --notes ""
    - name: Upload artifacts to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        '${{ github.ref_name }}' dist/**
        --repo '${{ github.repository }}'

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs:
    - build-all-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - pymctp
          - pymctp-exerciser-aardvark
          - pymctp-exerciser-qemu
          - pymctp-exerciser-serial

    environment:
      name: testpypi
      url: https://test.pypi.org/p/${{ matrix.package }}

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - name: Download distributions for ${{ matrix.package }}
      uses: actions/download-artifact@v4
      with:
        name: dist-${{ matrix.package }}
        path: dist/
    - name: Publish ${{ matrix.package }} to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true
